<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15 Puzzle</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-alt: #1f2937;
      --tile: #f8fafc;
      --tile-text: #0f172a;
      --empty: rgba(148, 163, 184, 0.18);
      --accent: #38bdf8;
      --shadow: rgba(15, 23, 42, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 50%);
      color: #e2e8f0;
      padding: 24px;
    }

    .app {
      width: min(92vw, 460px);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 22px;
      box-shadow: 0 18px 60px var(--shadow);
      padding: 22px 20px 18px;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: clamp(2rem, 4vw, 2.6rem);
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      flex: 1;
      background: var(--panel-alt);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
    }

    .stat-label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .stat-value {
      display: block;
      font-weight: 700;
      font-size: 1.2rem;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    button {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.09s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      font: inherit;
    }

    button:active { transform: translateY(1px) scale(0.99); }

    .shuffle-btn {
      padding: 0.8rem 1.3rem;
      background: linear-gradient(135deg, var(--accent), #60a5fa);
      color: #082f49;
      font-weight: 800;
      letter-spacing: 0.04em;
      box-shadow: 0 10px 22px rgba(56, 189, 248, 0.25);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 18px;
      border: 2px solid rgba(148, 163, 184, 0.18);
      padding: 12px;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.14);
      aspect-ratio: 1;
    }

    .tile,
    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      user-select: none;
      aspect-ratio: 1;
    }

    .tile {
      background: linear-gradient(135deg, #f8fafc 0%, #dbeafe 100%);
      color: var(--tile-text);
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 800;
      box-shadow: 0 6px 14px rgba(148, 163, 184, 0.22);
      border: 1px solid rgba(15, 23, 42, 0.06);
    }

    .tile:hover {
      box-shadow: 0 10px 18px rgba(56, 189, 248, 0.22);
    }

    .empty {
      background: var(--empty);
      border: 1px dashed rgba(148, 163, 184, 0.18);
    }

    .message {
      min-height: 2.5em;
      text-align: center;
      margin: 16px 0 0;
      color: #cbd5e1;
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .message.win {
      color: #86efac;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>15 PUZZLE</h1>

    <div class="hud" aria-label="Game stats">
      <div class="stat">
        <span class="stat-label">Moves</span>
        <span class="stat-value" id="moves">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="timer">00:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="shuffle-btn" id="shuffleBtn" type="button">Shuffle</button>
    </div>

    <div id="board" class="board" aria-label="Puzzle board" role="grid"></div>

    <p id="message" class="message">Arrange the tiles in order from 1 to 15.</p>
  </main>

  <script>
    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const timerEl = document.getElementById('timer');
    const messageEl = document.getElementById('message');
    const shuffleBtn = document.getElementById('shuffleBtn');

    const SIZE = 4;
    const SOLVED = Array.from({ length: SIZE * SIZE }, (_, index) => (index + 1) % (SIZE * SIZE));
    let board = [...SOLVED];
    let emptyIndex = board.indexOf(0);
    let moveCount = 0;
    let seconds = 0;
    let timerId = null;
    let isSolved = false;

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const secondsPart = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(secondsPart).padStart(2, '0')}`;
    }

    function updateStats() {
      movesEl.textContent = String(moveCount);
      timerEl.textContent = formatTime(seconds);
    }

    function setMessage(text, win = false) {
      messageEl.textContent = text;
      messageEl.classList.toggle('win', win);
    }

    function isAdjacent(indexA, indexB) {
      const rowA = Math.floor(indexA / SIZE);
      const colA = indexA % SIZE;
      const rowB = Math.floor(indexB / SIZE);
      const colB = indexB % SIZE;
      return Math.abs(rowA - rowB) + Math.abs(colA - colB) === 1;
    }

    function isBoardSolved() {
      return board.every((value, index) => value === SOLVED[index]);
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function startTimer() {
      stopTimer();
      timerId = setInterval(() => {
        if (!isSolved) {
          seconds += 1;
          updateStats();
        }
      }, 1000);
    }

    function renderBoard() {
      boardEl.innerHTML = '';

      for (let index = 0; index < board.length; index += 1) {
        const value = board[index];

        if (value === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.setAttribute('aria-hidden', 'true');
          boardEl.appendChild(empty);
          continue;
        }

        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'tile';
        tile.textContent = String(value);
        tile.setAttribute('aria-label', `Move tile ${value}`);
        tile.addEventListener('click', () => moveTile(index));
        boardEl.appendChild(tile);
      }
    }

    function tryMoveTile(targetIndex) {
      if (isSolved || !isAdjacent(targetIndex, emptyIndex)) {
        return false;
      }

      [board[targetIndex], board[emptyIndex]] = [board[emptyIndex], board[targetIndex]];
      emptyIndex = targetIndex;
      moveCount += 1;
      if (!timerId) {
        startTimer();
      }
      updateStats();
      renderBoard();

      if (isBoardSolved()) {
        isSolved = true;
        stopTimer();
        setMessage(`Solved in ${moveCount} moves and ${formatTime(seconds)}!`, true);
      }

      return true;
    }

    function moveTile(index) {
      if (isSolved) {
        return;
      }
      tryMoveTile(index);
    }

    function moveBlankByDirection(direction) {
      if (isSolved) {
        return;
      }

      const row = Math.floor(emptyIndex / SIZE);
      const col = emptyIndex % SIZE;

      let targetIndex = null;
      if (direction === 'up' && row < SIZE - 1) targetIndex = emptyIndex + SIZE;
      if (direction === 'down' && row > 0) targetIndex = emptyIndex - SIZE;
      if (direction === 'left' && col < SIZE - 1) targetIndex = emptyIndex + 1;
      if (direction === 'right' && col > 0) targetIndex = emptyIndex - 1;

      if (targetIndex !== null) {
        tryMoveTile(targetIndex);
      }
    }

    function resetState() {
      board = [...SOLVED];
      emptyIndex = board.indexOf(0);
      moveCount = 0;
      seconds = 0;
      isSolved = false;
      stopTimer();
      updateStats();
      setMessage('Arrange the tiles in order from 1 to 15.');
      renderBoard();
    }

    function shuffleBoard() {
      const working = [...SOLVED];
      let blank = working.indexOf(0);
      let previousBlank = -1;

      for (let step = 0; step < 220; step += 1) {
        const row = Math.floor(blank / SIZE);
        const col = blank % SIZE;
        const options = [];

        if (row > 0) options.push(blank - SIZE);
        if (row < SIZE - 1) options.push(blank + SIZE);
        if (col > 0) options.push(blank - 1);
        if (col < SIZE - 1) options.push(blank + 1);

        const validOptions = options.filter((index) => index !== previousBlank);
        const next = validOptions[Math.floor(Math.random() * validOptions.length)];

        [working[blank], working[next]] = [working[next], working[blank]];
        previousBlank = blank;
        blank = next;
      }

      if (working.every((value, index) => value === SOLVED[index])) {
        const row = Math.floor(blank / SIZE);
        const col = blank % SIZE;
        const options = [];

        if (row > 0) options.push(blank - SIZE);
        if (row < SIZE - 1) options.push(blank + SIZE);
        if (col > 0) options.push(blank - 1);
        if (col < SIZE - 1) options.push(blank + 1);

        const target = options[Math.floor(Math.random() * options.length)];
        [working[blank], working[target]] = [working[target], working[blank]];
        blank = target;
      }

      board = working;
      emptyIndex = blank;
      moveCount = 0;
      seconds = 0;
      isSolved = false;
      startTimer();
      updateStats();
      setMessage('Shuffled. Put the tiles back in order.');
      renderBoard();
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowUp') {
        event.preventDefault();
        moveBlankByDirection('up');
      }
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        moveBlankByDirection('down');
      }
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        moveBlankByDirection('left');
      }
      if (event.key === 'ArrowRight') {
        event.preventDefault();
        moveBlankByDirection('right');
      }
    });

    shuffleBtn.addEventListener('click', shuffleBoard);

    resetState();
    shuffleBoard();
  </script>
</body>
</html>
