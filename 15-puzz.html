<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>15-Puzzle (Classic Sliding Puzzle)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --size: min(420px, 90vmin);
      --tile-gap: 10px;
      --bg: #0f172a;
      --bg-2: #1e3a8a;
      --panel: rgba(15, 23, 42, 0.78);
      --panel-edge: rgba(255, 255, 255, 0.12);
      --accent: #fbbf24;
      --tile-color: #f8fafc;
      --board-glow: rgba(96, 165, 250, 0.35);
      --board-bg: linear-gradient(135deg, rgba(59,130,246,0.24), rgba(168,85,247,0.22), rgba(16,185,129,0.16));
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:
        radial-gradient(circle at top left, rgba(251, 191, 36, 0.2), transparent 25%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.2), transparent 28%),
        radial-gradient(circle at center, rgba(168, 85, 247, 0.18), transparent 35%),
        linear-gradient(135deg, #0f172a 0%, #1e293b 35%, #172554 100%);
      color:var(--tile-color);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
      gap:20px;
    }
    .container{
      width:var(--size);
      max-width:100%;
      background:linear-gradient(180deg, rgba(15,23,42,0.9), rgba(15,23,42,0.72));
      border:1px solid var(--panel-edge);
      border-radius:18px;
      padding:20px;
      box-shadow:0 16px 38px rgba(15, 23, 42, 0.7), inset 0 1px 0 rgba(255,255,255,0.07);
      backdrop-filter: blur(10px);
    }
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
    }
    header h1{font-size:1.05rem;margin:0}
    .controls{
      display:flex;
      gap:8px;
      align-items:center;
    }
    button{
      background:linear-gradient(135deg, rgba(59,130,246,0.25), rgba(168,85,247,0.2));
      color:var(--tile-color);
      border:1px solid rgba(255,255,255,0.18);
      padding:8px 12px;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
      box-shadow:0 8px 18px rgba(59,130,246,0.18);
      transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
    }
    button:hover{filter:brightness(1.08); transform:translateY(-1px)}
    button:active{transform:translateY(1px)}
    .meta{display:flex;gap:12px;align-items:center;font-size:0.95rem}
    .board-wrap{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:8px;
    }
    .board{
      width:calc(var(--size) - 64px);
      max-width:100%;
      aspect-ratio:1/1;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      grid-template-rows:repeat(4,1fr);
      gap:var(--tile-gap);
      background:var(--board-bg);
      padding:var(--tile-gap);
      border-radius:16px;
      position:relative;
      border:1px solid rgba(255,255,255,0.09);
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.12), 0 0 28px var(--board-glow);
      -webkit-user-select:none;
      user-select:none;
    }
    .tile{
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:calc(var(--size) * 0.06);
      font-weight:800;
      color:var(--tile-color);
      background:linear-gradient(135deg, rgba(59,130,246,0.95), rgba(147,51,234,0.9));
      border-radius:12px;
      box-shadow: 0 10px 18px rgba(2,6,23,0.45), inset 0 1px 0 rgba(255,255,255,0.24);
      transition: transform 200ms cubic-bezier(.2,.9,.2,1), box-shadow 120ms, filter 150ms ease;
      cursor: pointer;
      user-select:none;
      text-shadow: 0 2px 10px rgba(15,23,42,0.45);
    }
    .tile:hover{filter:saturate(1.1) brightness(1.04)}
    .tile:active{transform:scale(0.98)}
    .blank{
      background:rgba(15,23,42,0.18);
      border:1px dashed rgba(255,255,255,0.08);
      box-shadow:none;
      cursor:default;
    }
    .tile.movable{
      box-shadow: 0 12px 24px rgba(59,130,246,0.28), inset 0 1px 0 rgba(255,255,255,0.2);
      outline: 2px solid rgba(255,255,255,0.08);
    }
    .footer{
      display:flex;
      justify-content:space-between;
      margin-top:12px;
      font-size:0.95rem;
    }
    .overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.5));
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:12px;
      border-radius:12px;
      color:var(--tile-color);
      z-index:5;
      opacity:0;
      pointer-events:none;
      transform:scale(0.98);
      transition:all 240ms ease;
    }
    .overlay.show{
      opacity:1;
      pointer-events:auto;
      transform:scale(1);
    }
    .overlay .message{
      background:linear-gradient(180deg,#0b1220,#071029);
      padding:18px 22px;
      border-radius:10px;
      text-align:center;
      box-shadow:0 20px 60px rgba(2,6,23,0.6);
    }
    small.hint{opacity:0.8}
    @media (max-width:540px){
      .container{padding:14px}
      header h1{font-size:0.95rem}
    }
  </style>
</head>
<body>
  <div class="container" role="application" aria-label="15 puzzle game">
    <header>
      <h1>15-Puzzle</h1>
      <div class="controls">
        <div class="meta" aria-hidden="true">
          <div id="moves">Moves: 0</div>
          <div id="timer">Time: 00:00</div>
        </div>
        <button id="shuffleBtn" title="Shuffle to a solvable random position">Shuffle</button>
        <button id="resetBtn" title="Return to solved position">Reset</button>
      </div>
    </header>

    <div class="board-wrap">
      <div class="board" id="board" tabindex="0" aria-label="Puzzle board" aria-live="polite"></div>

      <div class="overlay" id="overlay" aria-hidden="true">
        <div class="message" id="winMessage" role="status"></div>
        <div>
          <button id="playAgain">Play again</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>
        <small class="hint">Click a tile next to the blank or use arrow keys to move.</small>
      </div>
      <div>
        <small class="hint">Tiles are shuffled into a guaranteed solvable state.</small>
      </div>
    </div>
  </div>

<script>
/*
  Classic 15-puzzle single-file implementation.
  - Click tiles adjacent to the blank to move them.
  - Arrow keys move a tile into the blank in the arrow direction (if possible).
  - Shuffle produces a random solvable position.
  - Tracks moves and elapsed time.
*/

// State
const size = 4; // 4x4 grid
let board = []; // length 16, values 1..15 or null for blank
let moves = 0;
let timerInterval = null;
let startTime = null;
let running = false;

const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timerEl = document.getElementById('timer');
const shuffleBtn = document.getElementById('shuffleBtn');
const resetBtn = document.getElementById('resetBtn');
const overlay = document.getElementById('overlay');
const winMessage = document.getElementById('winMessage');
const playAgainBtn = document.getElementById('playAgain');
const tilePalette = [
  ['#f87171', '#ef4444'],
  ['#fb7185', '#e11d48'],
  ['#fbbf24', '#f59e0b'],
  ['#34d399', '#10b981'],
  ['#60a5fa', '#2563eb'],
  ['#a78bfa', '#7c3aed'],
  ['#38bdf8', '#0284c7'],
  ['#f472b6', '#db2777'],
  ['#f97316', '#ea580c'],
  ['#4ade80', '#16a34a'],
  ['#2dd4bf', '#0f766e'],
  ['#c084fc', '#9333ea'],
  ['#facc15', '#ca8a04'],
  ['#22d3ee', '#0891b2'],
  ['#fb923c', '#f97316'],
  ['#818cf8', '#4f46e5']
];

// Initialize solved board
function solvedArray() {
  const arr = [];
  for (let i = 1; i <= size*size - 1; i++) arr.push(i);
  arr.push(null);
  return arr;
}

function tileBackground(val) {
  const [start, end] = tilePalette[(val - 1) % tilePalette.length];
  return `linear-gradient(135deg, ${start}, ${end})`;
}

// Utility: render board
function renderBoard(animated=true) {
  boardEl.innerHTML = '';
  board.forEach((val, idx) => {
    const cell = document.createElement('div');
    cell.className = 'tile';
    if (val === null) {
      cell.classList.add('blank');
      cell.setAttribute('aria-hidden','true');
      cell.textContent = '';
    } else {
      cell.textContent = val;
      cell.setAttribute('role','button');
      cell.setAttribute('tabindex','0');
      cell.setAttribute('aria-label', 'Tile ' + val);
      cell.style.background = tileBackground(val);
      // Click handler
      cell.addEventListener('click', () => tryMove(idx));
      cell.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tryMove(idx); }
      });
    }
    // Mark if movable (adjacent to blank)
    if (val !== null) {
      const blankIdx = board.indexOf(null);
      if (isAdjacent(idx, blankIdx)) {
        cell.classList.add('movable');
      }
    }
    boardEl.appendChild(cell);
  });
}

// Check adjacency
function isAdjacent(i, j) {
  const ri = Math.floor(i/size), rj = Math.floor(j/size);
  const ci = i % size, cj = j % size;
  const dr = Math.abs(ri - rj);
  const dc = Math.abs(ci - cj);
  return (dr + dc) === 1;
}

// Try moving tile at index idx into the blank if adjacent
function tryMove(idx) {
  const blankIdx = board.indexOf(null);
  if (!isAdjacent(idx, blankIdx)) return;
  board[blankIdx] = board[idx];
  board[idx] = null;
  moves++;
  updateMeta();
  renderBoard();
  if (!running) startTimer();
  checkWin();
}

// Move using arrow keys: ArrowUp should move tile below blank into blank (so blank moves down)
function moveByArrow(key) {
  const blank = board.indexOf(null);
  let target = null;
  const row = Math.floor(blank/size), col = blank%size;
  if (key === 'ArrowUp') {
    // move tile below blank (row+1, col) into blank
    if (row < size -1) target = (row+1)*size + col;
  } else if (key === 'ArrowDown') {
    if (row > 0) target = (row-1)*size + col;
  } else if (key === 'ArrowLeft') {
    if (col < size -1) target = row*size + (col+1);
  } else if (key === 'ArrowRight') {
    if (col > 0) target = row*size + (col-1);
  }
  if (target !== null) {
    tryMove(target);
  }
}

// Meta update
function updateMeta() {
  movesEl.textContent = 'Moves: ' + moves;
}

// Timer functions
function startTimer() {
  if (running) return;
  running = true;
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    timerEl.textContent = 'Time: ' + formatTime(elapsed);
  }, 500);
}

function stopTimer() {
  running = false;
  clearInterval(timerInterval);
  timerInterval = null;
}

function resetTimer() {
  stopTimer();
  timerEl.textContent = 'Time: 00:00';
  startTime = null;
}

// Format seconds to mm:ss
function formatTime(sec) {
  const m = String(Math.floor(sec/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return m + ':' + s;
}

// Win check
function checkWin() {
  const solved = solvedArray();
  let ok = true;
  for (let i=0;i<board.length;i++){
    if (board[i] !== solved[i]) { ok = false; break; }
  }
  if (ok) {
    stopTimer();
    showWin();
  }
}

function showWin() {
  const elapsed = startTime ? Math.floor((Date.now() - startTime) / 1000) : 0;
  winMessage.innerHTML = `<strong>🎉 Solved!</strong><div>Moves: ${moves} · Time: ${formatTime(elapsed)}</div>`;
  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden','false');
}

// Shuffle into a random solvable state (and not already solved)
function shuffleBoard() {
  // generate random permutations until solvable and not solved
  let arr;
  do {
    arr = randomPermutation(size*size);
  } while (!isSolvable(arr) || isSolved(arr));
  board = arr;
  moves = 0;
  updateMeta();
  resetTimer();
  renderBoard();
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden','true');
}

// Generate a random permutation of numbers 1..(n-1) and null representing blank
function randomPermutation(n) {
  const nums = [];
  for (let i=1;i<=n-1;i++) nums.push(i);
  nums.push(null);
  // Fisher-Yates
  for (let i = nums.length -1; i>0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [nums[i], nums[j]] = [nums[j], nums[i]];
  }
  return nums;
}

// Check if solved
function isSolved(arr) {
  for (let i=0;i<arr.length-1;i++) {
    if (arr[i] !== i+1) return false;
  }
  return arr[arr.length-1] === null;
}

// Solvability check for even-width board (4x4):
// A puzzle is solvable if (inversions + blankRowFromBottom) % 2 === 1
// where blankRowFromBottom counts 1 at bottom.
function isSolvable(arr) {
  const flat = arr.slice();
  const nums = flat.filter(x => x !== null);
  // inversions count
  let inv = 0;
  for (let i=0;i<nums.length;i++){
    for (let j=i+1;j<nums.length;j++){
      if (nums[i] > nums[j]) inv++;
    }
  }
  // blank row from bottom
  const blankIndex = arr.indexOf(null);
  const rowIndex = Math.floor(blankIndex / size); // 0-based from top
  const rowFromBottom = size - rowIndex; // 1-based from bottom
  // For 4x4 board, solvable if sum%2 === 1
  return ((inv + rowFromBottom) % 2) === 1;
}

// Reset to solved position
function resetBoard() {
  board = solvedArray();
  moves = 0;
  updateMeta();
  resetTimer();
  renderBoard();
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden','true');
}

// Initial setup
function init() {
  resetBoard();
  // Attach event listeners
  shuffleBtn.addEventListener('click', shuffleBoard);
  resetBtn.addEventListener('click', resetBoard);
  playAgainBtn.addEventListener('click', () => {
    shuffleBoard();
    overlay.classList.remove('show');
  });

  // Keyboard controls on board container
  boardEl.addEventListener('keydown', (e) => {
    const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
    if (keys.includes(e.key)) {
      e.preventDefault();
      moveByArrow(e.key);
    }
  });

  // Also global key handler for convenience
  document.addEventListener('keydown', (e) => {
    const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
    if (keys.includes(e.key)) {
      // only handle if focus not in an input and game not overlay-blocked
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (overlay.classList.contains('show')) return;
      moveByArrow(e.key);
    }
  });

  // Make the board focusable for keyboard usage
  boardEl.addEventListener('click', () => boardEl.focus());
  boardEl.setAttribute('tabindex','0');

  // Render initial solved board
  renderBoard();
}

// Start
init();
</script>
</body>
</html>
